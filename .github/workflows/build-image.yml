# Builds the Docker image on GitHub and pushes it to the Azure container registry.
# Azure for Students blocks ACR Tasks (cloud builds), so the image is built here instead.
# Repository secrets: ACR_USERNAME and ACR_PASSWORD (the registry's admin credentials).
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: deliveryfleetmasacr.azurecr.io
  IMAGE: deliveryfleet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
