[project]
name = "deliveryfleet"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.3.0",
    "chromadb==1.5.9",
    "crewai[tools]==1.15.41",
    "fastapi>=0.163.1",
    "fastmcp<4",
    "google-adk[a2a]==2.14.1",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.9.1",
    "seaborn>=0.13.2",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
